# Starship 設定（tokyo-night プリセットを土台に調整）
# https://starship.rs/ja-jp/config/
"$schema" = "https://starship.rs/config-schema.json"

# 1 行目: 左にディレクトリ・Git・言語・クラウド、右端に実行時間・終了コード・時刻
# 2 行目: 入力欄
format = """
[░▒▓](#a3aed2)\
[  ](bg:#a3aed2 fg:#090c0c)\
[](bg:#769ff0 fg:#a3aed2)\
$directory\
[](fg:#769ff0 bg:#394260)\
$git_branch\
$git_state\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$rust\
$python\
$golang\
[](fg:#212736 bg:#1d2230)\
$kubernetes\
$aws\
$terraform\
[ ](fg:#1d2230)\
$fill\
$cmd_duration\
$status\
$time
$character"""

# Git が遅いリポジトリでは、待たずに表示を省く（デフォルトのまま）
command_timeout = 500

[fill]
symbol = " "

[character]
success_symbol = "[❯](bold #9ece6a)"
error_symbol = "[❯](bold #f7768e)"

# ---- ディレクトリ: 省略せずフルパス（ホームは ~） ----
[directory]
style = "fg:#e3e5e5 bg:#769ff0"
format = "[ $path ]($style)[$read_only]($read_only_style)"
truncation_length = 0
truncate_to_repo = false
read_only = " 󰌾"
read_only_style = "fg:#f7768e bg:#769ff0"

# ---- Git: 軽めに ----
[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_state]
style = "bg:#394260"
format = '[[\($state( $progress_current/$progress_total)\) ](fg:#e0af68 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'
ignore_submodules = true   # サブモジュールの中までは調べない

# ---- 言語 ----
[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[python]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version)( \($virtualenv\)) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

# ---- クラウド・インフラ ----
[kubernetes]
disabled = false
symbol = "󱃾"
style = "bg:#1d2230"
format = '[[ $symbol $context( \($namespace\)) ](fg:#bb9af7 bg:#1d2230)]($style)'

# EKS の長い ARN をクラスタ名だけにする
[[kubernetes.contexts]]
context_pattern = "arn:aws:eks:[^:]+:[0-9]+:cluster/(?P<cluster>.+)"
context_alias = "$cluster"

[aws]
symbol = ""
style = "bg:#1d2230"
format = '[[ $symbol ($profile)( \($region\)) ](fg:#e0af68 bg:#1d2230)]($style)'

[terraform]
symbol = "󱁢"
style = "bg:#1d2230"
format = '[[ $symbol $workspace ](fg:#7aa2f7 bg:#1d2230)]($style)'   # $version は terraform を実行して遅いので出さない

# ---- 右端 ----
[cmd_duration]
min_time = 2000
format = "[ $duration]($style) "
style = "fg:#e0af68"

[status]
disabled = false
format = "[ $status]($style) "
style = "fg:#f7768e"

[time]
disabled = false
time_format = "%R"
format = "[ $time]($style)"
style = "fg:#a0a9cb"
